services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saathimart-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      FRAPPE_SITE: ${FRAPPE_SITE:-saathimart.local}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: 6379
    volumes:
      - ./saathimart:/home/frappe/saathimart   # live-reload in dev
      - bench_data:/home/frappe/bench
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  mariadb:
    image: mariadb:11.2
    container_name: saathimart-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis — Frappe page/query cache
  redis-cache:
    image: redis:7-alpine
    container_name: saathimart-redis-cache
    restart: unless-stopped
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Queue Redis — background jobs + cross-site pub/sub
  redis-queue:
    image: redis:7-alpine
    container_name: saathimart-redis-queue
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_queue_data:/data
    ports:
      - "${REDIS_QUEUE_PORT:-6380}:6379"   # expose so vendor sites can subscribe
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  mariadb_data:
  redis_cache_data:
  redis_queue_data:
  bench_data:
