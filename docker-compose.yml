services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saathimart-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    environment:
      FRAPPE_SITE: ${FRAPPE_SITE:-saathimart.localhost}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: 6379
      WORKERS: 32
      THREADS: 4
      WORKER_TIMEOUT: 300
    volumes:
      - ..:/home/frappe/saathimart-src   # repo root (live-reload in dev)
      - bench_data:/home/frappe/bench
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6144M
        reservations:
          cpus: '2.0'
          memory: 2048M
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  mariadb:
    image: mariadb:11.2
    container_name: saathimart-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/my.cnf:/etc/mysql/conf.d/99-saathimart.cnf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Cache Redis — Frappe page/query cache + session store (512MB for better hit ratio)
  redis-cache:
    image: redis:7-alpine
    container_name: saathimart-redis-cache
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_cache_data:/data
      - ./docker/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Queue Redis — background jobs + cross-site pub/sub
  redis-queue:
    image: redis:7-alpine
    container_name: saathimart-redis-queue
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_queue_data:/data
    ports:
      - "${REDIS_QUEUE_PORT:-6380}:6379"   # expose so vendor sites can subscribe
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M
        reservations:
          cpus: '0.1'
          memory: 32M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx Reverse Proxy — Gzip compression + static asset serving
  nginx:
    image: nginx:alpine
    container_name: saathimart-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Qdrant Vector Database — Semantic product search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: saathimart-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:
  redis_cache_data:
  redis_queue_data:
  bench_data:
  qdrant_data:
