# Hub + vendor integration stack — brings up one saathimart hub and TWO
# saathimart-vendor sites (vendor1.localhost + vendor2.localhost) in a
# single multi-site vendor bench container with a shared MariaDB/Redis so
# the full sync surface (order.new, payment.received, stock, mapping,
# nearest-vendor routing) can be exercised end-to-end locally.
#
#   docker compose -f docker/docker-compose.integration.yml up -d
#
# Hub:      http://localhost:8000  (Host: saathimart.localhost)
# Vendor 1: http://localhost:8001  (Host: vendor1.localhost)
# Vendor 2: http://localhost:8001  (Host: vendor2.localhost)
#
# WEBHOOK_SECRET must match on both sides — it is what hub→vendor pushes
# (order.new, payment.received) authenticate with, and vendor→hub pushes
# (stock/barcode events) verify against.
services:

  mariadb:
    image: mariadb:10.6
    container_name: sm-int-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - int_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    container_name: sm-int-redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Two Redis *instances* (not one instance, two DBs): Frappe caches some
  # data without a site prefix, and queue keys must never share an
  # eviction domain with cache keys.
  redis-queue:
    image: redis:7-alpine
    container_name: sm-int-redis-queue
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  hub:
    image: saathimart-hub:latest
    container_name: sm-int-hub
    hostname: hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      FRAPPE_SITE: saathimart.localhost
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: "6379"
      WEBHOOK_SECRET: saathimart-webhook-secret
    volumes:
      - int_hub_bench:/home/frappe/bench
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  vendors:
    image: saathimart-vendor:latest
    container_name: sm-int-vendors
    hostname: vendors
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      VENDOR_SITES: "vendor1.localhost vendor2.localhost"
      VENDOR_PORT: "8000"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin
      # DB index 1 isolates the vendor bench's RQ queues/cache from the
      # hub's: Frappe workers pull jobs by queue name only, so two benches
      # sharing one Redis DB would each execute the other's site jobs and
      # crash on frappe.init() for an unknown site.
      REDIS_CACHE: redis://redis-cache:6379/1
      REDIS_QUEUE: redis://redis-queue:6379/1
      WEBHOOK_SECRET: saathimart-webhook-secret
    volumes:
      - int_vendor_bench:/home/frappe/bench
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      # Vendor init syncs locations to http://hub:8000 at startup; a first
      # boot may reach that line before the hub finishes provisioning. The
      # sync step is best-effort by design (see its try/except), and the
      # hub retries delivery of queued events anyway.

volumes:
  int_mariadb_data:
  int_hub_bench:
  int_vendor_bench:
