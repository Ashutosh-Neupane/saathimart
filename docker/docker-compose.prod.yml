# Production Docker Compose for the SaathiMart Hub only (no vendor service —
# each vendor runs its own saathimart-vendor deployment against this hub's
# public URL; see saathimart-vendor's own docs for that side).
# Usage: docker compose -f docker/docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Set WEBHOOK_SECRET, DB_PASSWORD, ADMIN_PASSWORD in .env
#   - Place SSL certs in ./certs/ or use Let's Encrypt
#   - Configure domain names in nginx.conf

services:
  nginx:
    image: nginx:alpine
    container_name: sm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - sm_nginx_logs:/var/log/nginx
    depends_on:
      hub:
        condition: service_healthy
    networks:
      - sm-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  hub:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sm-hub
    restart: unless-stopped
    environment:
      - FRAPPE_SITE=saathimart.localhost
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_ROOT_PASSWORD=${DB_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - REDIS_QUEUE_HOST=redis-queue
      - REDIS_QUEUE_PORT=6379
      - WORKERS=4
      - THREADS=8
    volumes:
      - sm_hub_bench:/home/frappe/bench
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - sm-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  hub-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sm-hub-worker
    restart: unless-stopped
    # cwd must be $BENCH/sites (see docker/init.sh's Procfile comment) —
    # Frappe's per-site log handler builds its file path as a relative
    # join of site + "logs" + logfile, so any other cwd throws
    # FileNotFoundError. Shares the hub's full bench volume (env, config,
    # apps, sites) rather than a partial split — `bench worker` needs the
    # whole bench directory (virtualenv included), not just sites/apps/logs.
    command: ["sh", "-c", "cd /home/frappe/bench/sites && /usr/local/bin/bench worker --queue default,short,long"]
    volumes:
      - sm_hub_bench:/home/frappe/bench
    depends_on:
      hub:
        condition: service_healthy
    networks:
      - sm-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  mariadb:
    image: mariadb:10.6
    container_name: sm-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=saathimart
    volumes:
      - sm_mariadb_data:/var/lib/mysql
      - ./mariadb.conf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sm-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis-cache:
    image: redis:7-alpine
    container_name: sm-redis-cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - sm_redis_cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sm-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis-queue:
    image: redis:7-alpine
    container_name: sm-redis-queue
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - sm_redis_queue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sm-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sm-scheduler
    restart: unless-stopped
    command: ["sh", "-c", "cd /home/frappe/bench/sites && /usr/local/bin/bench schedule"]
    volumes:
      - sm_hub_bench:/home/frappe/bench
    depends_on:
      hub:
        condition: service_healthy
    networks:
      - sm-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  logrotate:
    image: alpine:latest
    container_name: sm-logrotate
    restart: unless-stopped
    command: >
      sh -c "while true; do
        find /var/log -name '*.log' -size +10M -exec truncate -s 5M {} \;
        find /var/log -name '*.log.*' -mtime +7 -delete
        sleep 86400
      done"
    volumes:
      # Whole bench volume, not just a logs subpath — `find` below only
      # touches *.log files regardless of what else lives under the mount.
      - sm_hub_bench:/var/log/hub
      - sm_nginx_logs:/var/log/nginx
    networks:
      - sm-network

volumes:
  sm_hub_bench:
  sm_mariadb_data:
  sm_redis_cache:
  sm_redis_queue:
  sm_nginx_logs:

networks:
  sm-network:
    driver: bridge
