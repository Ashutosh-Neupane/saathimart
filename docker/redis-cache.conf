# ── Redis Cache Optimization (2 core / 4GB server) ──────────────────────────
# Max memory: 512MB for cache (increased from 256MB for better hit ratio)
maxmemory 2gb
maxmemory-policy allkeys-lru

# ── Persistence (cache-only, no RDB needed) ─────────────────────────────────
save ""
appendonly no

# ── Networking ───────────────────────────────────────────────────────────────
tcp-keepalive 60
tcp-backlog 511
timeout 300

# ── Performance ──────────────────────────────────────────────────────────────
hz 10
dynamic-hz yes
io-threads 2
io-threads-do-reads yes

# ── Memory Optimization ─────────────────────────────────────────────────────
hash-max-ziplist-entries 128
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 128
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
